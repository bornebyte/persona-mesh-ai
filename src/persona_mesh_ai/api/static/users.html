<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management — Persona Mesh AI</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #fafafa;
            --surface: #fff;
            --surface-2: #f4f4f5;
            --border: #e4e4e7;
            --border-strong: #d4d4d8;
            --text: #18181b;
            --muted: #71717a;
            --faint: #a1a1aa;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eff6ff;
            --success: #059669;
            --success-soft: #ecfdf5;
            --warning: #d97706;
            --warning-soft: #fffbeb;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
            --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, .08), 0 4px 8px rgba(0, 0, 0, .04);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh
        }

        .app {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px 60px
        }

        header.topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -.01em
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--text);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 700
        }

        .topbar-links {
            display: flex;
            gap: 8px
        }

        .topbar-links a {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent
        }

        .topbar-links a:hover {
            background: var(--surface-2);
            color: var(--text);
            border-color: var(--border)
        }

        .grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            align-items: start
        }

        @media(max-width:960px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm)
        }

        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .card-title {
            font-weight: 600;
            font-size: 14px
        }

        .card-body {
            padding: 18px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
            white-space: nowrap
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: var(--accent-hover)
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong)
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--surface-2)
        }

        .btn-danger {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: #fecaca
        }

        .btn-danger:hover:not(:disabled) {
            background: #fee2e2
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border-color: transparent
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--surface-2);
            color: var(--text)
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 4px
        }

        .user-item {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background .12s, border-color .12s
        }

        .user-item:hover {
            background: var(--surface-2);
            border-color: var(--border-strong)
        }

        .user-item.active {
            background: var(--accent-soft);
            border-color: var(--accent)
        }

        .user-item .u-name {
            font-weight: 600;
            font-size: 13.5px;
            margin-bottom: 2px
        }

        .user-item .u-email {
            font-size: 12px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .user-item .u-meta {
            font-size: 11px;
            color: var(--faint);
            margin-top: 4px;
            font-family: var(--mono);
            overflow-wrap: anywhere
        }

        .empty-list {
            padding: 24px 14px;
            text-align: center;
            color: var(--muted);
            font-size: 13px
        }

        .field {
            margin-bottom: 14px
        }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            margin-bottom: 5px
        }

        .field label .hint {
            color: var(--faint);
            font-weight: 400;
            margin-left: 4px
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 8px 11px;
            font-family: var(--font);
            font-size: 13.5px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color .15s, box-shadow .15s
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12)
        }

        .field textarea {
            resize: vertical;
            min-height: 60px
        }

        .field textarea.code {
            font-family: var(--mono);
            font-size: 12.5px;
            min-height: 120px
        }

        .field .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            margin-bottom: 12px
        }

        .section-title:not(:first-child) {
            margin-top: 20px
        }

        .api-key-entry {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-key-entry input {
            flex: 1;
            min-width: 0;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            padding-top: 14px;
            margin-top: 6px;
            border-top: 1px solid var(--border)
        }

        .form-actions .btn-primary {
            flex: 1
        }

        .alert {
            display: flex;
            gap: 10px;
            padding: 11px 13px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
            border: 1px solid;
            align-items: flex-start
        }

        .alert-error {
            background: var(--danger-soft);
            border-color: #fecaca;
            color: #991b1b
        }

        .alert-success {
            background: var(--success-soft);
            border-color: #a7f3d0;
            color: #065f46
        }

        .alert-info {
            background: var(--accent-soft);
            border-color: #bfdbfe;
            color: #1e40af
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            max-width: 380px
        }

        .toast {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: var(--text);
            color: #fff;
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            animation: slideIn .2s ease-out;
            word-break: break-word
        }

        .toast.success {
            background: var(--success)
        }

        .toast.error {
            background: var(--danger)
        }

        @keyframes slideIn {
            from {
                transform: translateY(10px);
                opacity: 0
            }

            to {
                transform: translateY(0);
                opacity: 1
            }
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            background: var(--surface-2);
            color: var(--muted);
            border: 1px solid var(--border)
        }

        .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--faint)
        }

        .status.online .dot {
            background: var(--success)
        }

        .status.offline .dot {
            background: var(--danger)
        }

        .status.checking .dot {
            background: var(--warning);
            animation: pulse 1.2s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .35
            }
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            margin-right: 4px;
            margin-bottom: 4px
        }

        .placeholder {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted)
        }

        .placeholder svg {
            margin-bottom: 12px;
            color: var(--faint)
        }

        .placeholder h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px
        }

        .hidden {
            display: none !important
        }
    </style>
</head>

<body>
    <div class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">PM</div>
                <span>Persona Mesh AI — Users</span>
            </div>
            <div class="topbar-links">
                <a href="/">← Back to app</a>
                <span id="status" class="status checking"><span class="dot"></span><span
                        id="status-text">Checking…</span></span>
            </div>
        </header>

        <div class="grid">

            <!-- Left: user list -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Users</div>
                    <button class="btn btn-primary btn-sm" id="new-user-btn">+ New</button>
                </div>
                <div class="card-body" style="padding:12px;">
                    <div id="user-list" class="user-list">
                        <div class="empty-list">Loading…</div>
                    </div>
                </div>
            </div>

            <!-- Right: editor -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title" id="editor-title">New user</div>
                    <span id="editor-mode" class="status">Create</span>
                </div>
                <div class="card-body">
                    <div id="alerts"></div>

                    <div id="placeholder" class="placeholder">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <h3>Select a user to edit</h3>
                        <p>Pick a user from the list, or click <strong>+ New</strong> to create one.</p>
                    </div>

                    <form id="user-form" class="hidden" novalidate>

                        <div class="section-title">Persona</div>

                        <div class="field">
                            <label for="f-id">ID <span class="hint">(required)</span></label>
                            <input id="f-id" type="text" autocomplete="off" spellcheck="false"
                                placeholder="rahul_sharma2349742934789928" />
                        </div>

                        <div class="field">
                            <label for="f-name">Name <span class="hint">(required)</span></label>
                            <input id="f-name" type="text" placeholder="Rahul Sharma" />
                        </div>

                        <div class="field">
                            <label for="f-role">Role <span class="hint">(required)</span></label>
                            <input id="f-role" type="text" placeholder="Software Engineer" />
                        </div>

                        <div class="field">
                            <label for="f-description">Description <span class="hint">(required)</span></label>
                            <textarea id="f-description" placeholder="Describe this persona"></textarea>
                        </div>

                        <div class="field">
                            <label for="f-relationship">Relationship <span class="hint">(required)</span></label>
                            <input id="f-relationship" type="text" placeholder="Colleague" />
                        </div>

                        <div class="field">
                            <label for="f-personality">Personality <span class="hint">(required)</span></label>
                            <textarea id="f-personality" placeholder="Friendly, helpful, and curious."></textarea>
                        </div>

                        <div class="divider"></div>

                        <div class="section-title">API key</div>
                        <div class="field">
                            <label for="f-api-key">API Key <span class="hint" id="api-key-required">(required)</span></label>
                            <div class="api-key-entry">
                                <input id="f-api-key" type="password" autocomplete="new-password" spellcheck="false"
                                    placeholder="Enter your API key" />
                                <button type="button" class="btn btn-secondary btn-sm" id="copy-key-btn">Copy</button>
                            </div>
                            <div style="font-size:12px;color:var(--muted);margin-top:4px;">
                                You provide this key. When editing, leave it blank to keep the current key.
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
                            <button type="button" class="btn btn-danger" id="delete-btn">Delete</button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        (function () {
            "use strict";

            const $ = (id) => document.getElementById(id);
            const apiBase = () => "";            // all requests use relative paths

            const userListEl = $("user-list");
            const form = $("user-form");
            const placeholder = $("placeholder");
            const editorTitle = $("editor-title");
            const editorMode = $("editor-mode");
            const alertsEl = $("alerts");
            const statusEl = $("status");
            const statusText = $("status-text");
            const toastContainer = $("toast-container");

            let editingUserId = null;
            let busy = false;

            // ---------- Helpers ----------
            function toast(msg, type = "") {
                const el = document.createElement("div");
                el.className = "toast " + type;
                el.textContent = msg;
                toastContainer.appendChild(el);
                setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .2s"; setTimeout(() => el.remove(), 220); }, 3200);
            }

            function clearAlerts() { alertsEl.innerHTML = ""; }

            function showAlert(kind, message) {
                const div = document.createElement("div");
                div.className = "alert alert-" + kind;
                div.textContent = message;
                div.style.cursor = "pointer";
                div.addEventListener("click", () => div.remove());
                alertsEl.appendChild(div);
            }

            function escapeHtml(s) {
                return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            // ---------- Health ----------
            async function checkHealth() {
                statusEl.className = "status checking";
                statusText.textContent = "Checking…";
                try {
                    const res = await fetch("/health", { headers: { Accept: "application/json" } });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const data = await res.json();
                    if (data.status === "healthy") { statusEl.className = "status online"; statusText.textContent = "Online"; }
                    else { statusEl.className = "status offline"; statusText.textContent = "Unhealthy"; }
                } catch {
                    statusEl.className = "status offline";
                    statusText.textContent = "Offline";
                }
            }

            // ---------- List ----------
            async function loadUsers() {
                try {
                    const res = await fetch(apiBase() + "/api/v1/users", { headers: { Accept: "application/json" } });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const users = await res.json();
                    renderUserList(users);
                    if (editingUserId && !users.some(u => u.id === editingUserId)) {
                        // User was deleted elsewhere
                        editingUserId = null;
                        showEditorEmpty();
                    }
                } catch (err) {
                    userListEl.innerHTML = `<div class="empty-list" style="color:var(--danger)">Failed to load: ${escapeHtml(err.message)}</div>`;
                }
            }

            function renderUserList(users) {
                userListEl.innerHTML = "";
                if (!users || users.length === 0) {
                    userListEl.innerHTML = '<div class="empty-list">No users yet. Click <strong>+ New</strong>.</div>';
                    return;
                }
                users.forEach(u => {
                    const el = document.createElement("div");
                    el.className = "user-item" + (u.id === editingUserId ? " active" : "");
                    el.innerHTML = `
        <div class="u-name">${escapeHtml(u.name)}</div>
        <div class="u-email">${escapeHtml(u.role || "—")}</div>
        <div class="u-meta">${escapeHtml(u.id)}</div>
      `;
                    el.addEventListener("click", () => openUser(u.id));
                    userListEl.appendChild(el);
                });
            }

            // ---------- Editor ----------
            function showEditorEmpty() {
                form.classList.add("hidden");
                placeholder.classList.remove("hidden");
                editorTitle.textContent = "New user";
                editorMode.textContent = "Create";
                editingUserId = null;
                $("f-api-key").value = "";
                clearAlerts();
            }

            function populateForm(user) {
                $("f-id").value = user.id || "";
                $("f-id").readOnly = true;
                $("f-name").value = user.name || "";
                $("f-role").value = user.role || "";
                $("f-description").value = user.description || "";
                $("f-relationship").value = user.relationship || "";
                $("f-personality").value = user.personality || "";
                $("f-api-key").value = "";
                $("f-api-key").required = false;
                $("api-key-required").textContent = "(optional)";
            }

            function clearFormForNew() {
                form.reset();
                $("f-id").readOnly = false;
                $("f-api-key").value = "";
                $("f-api-key").required = true;
                $("api-key-required").textContent = "(required)";
            }

            function showEditorForNew() {
                editingUserId = null;
                clearAlerts();
                clearFormForNew();
                form.classList.remove("hidden");
                placeholder.classList.add("hidden");
                editorTitle.textContent = "New user";
                editorMode.textContent = "Create";
                document.querySelectorAll(".user-item").forEach(e => e.classList.remove("active"));
            }

            async function openUser(id) {
                clearAlerts();
                try {
                    const res = await fetch(apiBase() + "/api/v1/users/" + encodeURIComponent(id), { headers: { Accept: "application/json" } });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const user = await res.json();
                    editingUserId = user.id;
                    populateForm(user);
                    form.classList.remove("hidden");
                    placeholder.classList.add("hidden");
                    editorTitle.textContent = user.name || ("User #" + user.id);
                    editorMode.textContent = "Editing #" + user.id;
                    document.querySelectorAll(".user-item").forEach(e => e.classList.remove("active"));
                    const match = [...userListEl.children].find(e =>
                        e.querySelector(".u-meta")?.textContent === user.id
                    );
                    if (match) match.classList.add("active");
                } catch (err) {
                    showAlert("error", "Failed to load user: " + err.message);
                }
            }

            // ---------- Build payload from form ----------
            function buildPayload() {
                const id = $("f-id").value.trim();
                const name = $("f-name").value.trim();
                const role = $("f-role").value.trim();
                const description = $("f-description").value.trim();
                const relationship = $("f-relationship").value.trim();
                const personality = $("f-personality").value.trim();
                if (!id) throw new Error("ID is required");
                if (!name) throw new Error("Name is required");
                if (!role) throw new Error("Role is required");
                if (!description) throw new Error("Description is required");
                if (!relationship) throw new Error("Relationship is required");
                if (!personality) throw new Error("Personality is required");

                const apiKey = $("f-api-key").value.trim();
                if (editingUserId == null && !apiKey) throw new Error("API key is required");
                const payload = {
                    id,
                    name,
                    role,
                    description,
                    relationship,
                    personality,
                };
                if (apiKey) payload.api_key = apiKey;
                return payload;
            }

            // ---------- Save (create or update) ----------
            async function saveUser(ev) {
                ev.preventDefault();
                if (busy) return;
                clearAlerts();

                let payload;
                try {
                    payload = buildPayload();
                } catch (err) {
                    showAlert("error", err.message);
                    return;
                }

                busy = true;
                const saveBtn = $("save-btn");
                saveBtn.disabled = true;
                saveBtn.textContent = "Saving…";

                try {
                    const isUpdate = editingUserId != null;
                    if (isUpdate) delete payload.id;
                    const url = isUpdate
                        ? apiBase() + "/api/v1/users/" + encodeURIComponent(editingUserId)
                        : apiBase() + "/api/v1/users";
                    const method = isUpdate ? "PATCH" : "POST";

                    const res = await fetch(url, {
                        method,
                        headers: { "Content-Type": "application/json", Accept: "application/json" },
                        body: JSON.stringify(payload),
                    });

                    if (!res.ok) {
                        let detail = "HTTP " + res.status;
                        try {
                            const body = await res.json();
                            if (typeof body.detail === "string") detail = body.detail;
                            else if (Array.isArray(body.detail)) detail = body.detail.map(e => `${(e.loc || []).join(".")}: ${e.msg}`).join("\n");
                        } catch { }
                        throw new Error(detail);
                    }

                    const user = await res.json();
                    const enteredApiKey = $("f-api-key").value;
                    editingUserId = user.id;
                    populateForm(user);
                    $("f-api-key").value = enteredApiKey;
                    editorTitle.textContent = user.name || ("User #" + user.id);
                    editorMode.textContent = "Editing #" + user.id;
                    toast(isUpdate ? "User updated" : "User created", "success");
                    await loadUsers();
                    // Re-highlight
                    const match = [...userListEl.children].find(e =>
                        e.querySelector(".u-meta")?.textContent === user.id
                    );
                    if (match) match.classList.add("active");
                } catch (err) {
                    showAlert("error", "Save failed: " + err.message);
                    toast("Save failed", "error");
                } finally {
                    busy = false;
                    saveBtn.disabled = false;
                    saveBtn.textContent = "Save";
                }
            }

            // ---------- Delete ----------
            async function deleteUser() {
                if (!editingUserId || busy) return;
                if (!confirm("Delete this user permanently? This cannot be undone.")) return;

                busy = true;
                const delBtn = $("delete-btn");
                delBtn.disabled = true;

                try {
                    const res = await fetch(apiBase() + "/api/v1/users/" + encodeURIComponent(editingUserId), { method: "DELETE" });
                    if (!res.ok && res.status !== 204) {
                        throw new Error("HTTP " + res.status);
                    }
                    toast("User deleted", "success");
                    editingUserId = null;
                    showEditorEmpty();
                    await loadUsers();
                } catch (err) {
                    showAlert("error", "Delete failed: " + err.message);
                } finally {
                    busy = false;
                    delBtn.disabled = false;
                }
            }

            // ---------- API key actions ----------
            async function copyApiKey() {
                const apiKey = $("f-api-key").value.trim();
                if (!apiKey) return;
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(apiKey);
                    } else {
                        const ta = document.createElement("textarea");
                        ta.value = apiKey;
                        ta.style.position = "fixed";
                        ta.style.left = "-9999px";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                    }
                    toast("API key copied", "success");
                } catch (err) {
                    toast("Copy failed: " + err.message, "error");
                }
            }

            // ---------- Wiring ----------
            $("new-user-btn").addEventListener("click", showEditorForNew);
            $("save-btn").addEventListener("click", saveUser);
            form.addEventListener("submit", saveUser);
            $("delete-btn").addEventListener("click", deleteUser);
            $("copy-key-btn").addEventListener("click", copyApiKey);

            // ---------- Init ----------
            (function init() {
                checkHealth();
                loadUsers();
                setInterval(checkHealth, 30000);
                setInterval(loadUsers, 15000);
            })();
        })();
    </script>
</body>

</html>
