[project]
name = "persona-mesh-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shubham Shah", email = "shahshubham1888@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "firecrawl-py>=4.54.0",
    "httpx2>=2.16.0",
    "langfuse>=5.1.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "litellm>=1.106.6",
    "mcp[cli]>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
persona-mesh-ai = "persona_mesh_ai:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
